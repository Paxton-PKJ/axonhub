# Copy from https://github.com/spf13/cobra
# https://github.com/spf13/cobra/blob/master/LICENSE.txt
name: Test
on:
  push:
    branches:
      - "main"
      - "unstable"
      - "release/**"
      - "feature/**"
  pull_request:
    branches:
      - "main"
      - "unstable"
      - "release/**"
      - "feature/**"
env:
  GO111MODULE: on
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: stable

      - name: Generate GraphQL and Ent code
        run: make generate

      - name: Verify generated code is committed
        id: generated-code
        run: |
          git diff --binary > "$RUNNER_TEMP/generated-code.patch"
          git ls-files --others --exclude-standard -z -- internal/ent internal/server/gql > "$RUNNER_TEMP/generated-code-untracked"
          while IFS= read -r -d '' path; do
            git diff --no-index --binary -- /dev/null "$path" >> "$RUNNER_TEMP/generated-code.patch" || test "$?" -eq 1
          done < "$RUNNER_TEMP/generated-code-untracked"
          git diff --exit-code
          test ! -s "$RUNNER_TEMP/generated-code-untracked"

      - name: Upload generated code patch
        if: failure() && steps.generated-code.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: generated-code-patch
          path: ${{ runner.temp }}/generated-code.patch
          if-no-files-found: error

      - name: Test
        run: make test-backend-all

  test-frontend-unit:
    name: Test Frontend Unit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install pnpm
        uses: pnpm/action-setup@v6
        with:
          package_json_file: frontend/package.json
          run_install: false

      # The *.test.mjs suites import .ts modules directly, which needs native
      # TypeScript type stripping (enabled by default since Node 22.18).
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: 'pnpm'
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install frontend dependencies
        working-directory: frontend
        run: pnpm install --frozen-lockfile

      - name: Test
        working-directory: frontend
        run: pnpm test:unit

  # Informational only: the upstream frontend does not pass tsc yet, so the
  # check must not gate the unit tests or the workflow conclusion.
  typecheck-frontend:
    name: Typecheck Frontend
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install pnpm
        uses: pnpm/action-setup@v6
        with:
          package_json_file: frontend/package.json
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: 'pnpm'
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install frontend dependencies
        working-directory: frontend
        run: pnpm install --frozen-lockfile

      - name: Type check
        working-directory: frontend
        run: pnpm exec tsc -p tsconfig.app.json --noEmit
